<div class="landing-container">
    <!-- This button automatically disappears when the page goes into fullscreen mode -->
    <button id="fullscreen-btn" onclick="enterFullscreenAndStart()" style="padding: 15px 30px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.3s ease;">
        Go Fullscreen & Download
    </button>
</div>

<script>
function getOS() {
    if (navigator.userAgentData && navigator.userAgentData.platform) {
        return navigator.userAgentData.platform;
    }
    const userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.includes("win")) return "Windows";
    if (userAgent.includes("mac") && !("ontouchend" in document)) return "macOS";
    if (userAgent.includes("linux")) return "Linux";
    if (/iphone|ipad|ipod/.test(userAgent) || (userAgent.includes("mac") && "ontouchend" in document)) return "iOS";
    if (userAgent.includes("android")) return "Android";
    return "Unknown OS";
}

// Global listener to track if fullscreen state changes (e.g. if the user presses ESC)
function handleFullscreenChange() {
    const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    const btn = document.getElementById('fullscreen-btn');
    
    if (btn) {
        if (isFullscreen) {
            btn.style.display = 'none'; // Hide when in fullscreen
        } else {
            btn.style.display = 'block'; // Show if they exit fullscreen
        }
    }
}

document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('msfullscreenchange', handleFullscreenChange);

function enterFullscreenAndStart() {
    const elem = document.documentElement;
    
    // Request fullscreen mode cross-browser
    if (elem.requestFullscreen) {
        elem.requestFullscreen().then(runPrankSequence).catch(() => { runPrankSequence(); });
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
        runPrankSequence();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
        runPrankSequence();
    } else {
        runPrankSequence(); // Fallback if browser doesn't support fullscreen
    }
}

            .cursor { animation: blink 1s step-end infinite; }
            p { margin: 5px 0; line-height: 1.4; }
        </style>
        <div id="terminal" style="background:#050505; color:#00ff33; font-family:'Courier New', monospace; font-size: 15px; padding:25px; height:100vh; width:100vw; box-sizing:border-box; overflow:hidden; position:fixed; top:0; left:0; z-index:999999;">
            <div id="terminal-content"></div>
            <span class="cursor">_</span>

    `;

    const content = document.getElementById('terminal-content');
    const terminal = document.getElementById('terminal');

    const lines = [

        { text: `> Wiping encryption keys: ${path2} ... [DELETED]`, delay: 2400, color: '#ffcc00' },
        { text: `\n[CRITICAL ERROR] UNHANDLED EXCEPTION IN ROOT KERNEL`, delay: 3000, color: '#ff3333' },
        { text: `> FORCED SYSTEM UNLINK INITIATED BY SYSTEM POLICY`, delay: 3400, color: '#ff3333' },

                    <div style="text-align:center; margin-top:20vh; font-family:sans-serif;">

</script>
